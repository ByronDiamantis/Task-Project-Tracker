spring.application.name=task-project-tracker

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/task_tracker_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:2000}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.hibernate.ddl-auto=update