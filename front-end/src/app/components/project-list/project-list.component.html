<div class="projects-container">

    <!-- 1. ΠΡΟΒΟΛΗ LISTAS PROJECTS (όταν ΔΕΝ έχει επιλεγεί project) -->
    <div *ngIf="!selectedProjectId">

        <!-- Φόρμα Δημιουργίας Νέου Project -->
        <div class="create-card">
            <h3>Δημιουργία Νέου Project</h3>
            <form (ngSubmit)="createProject()">
                <div class="form-group">
                    <input
                        type="text"
                        [(ngModel)]="newProject.title"
                        name="title"
                        placeholder="Τίτλος Project"
                        required
                    />
                </div>
                <div class="form-group">
                    <textarea
                        [(ngModel)]="newProject.description"
                        name="description"
                        placeholder="Περιγραφή Project"
                    ></textarea>                    
                </div>
                
                <!-- ΠΡΟΣΟΧΗ: Μόνο type="submit", ΧΩΡΙΣ (click) -->
                <button type="submit" class="btn-create">+ Δημιουργία Project</button>
            </form>
        </div>

        <hr />

        <h2>Τα Projects μου</h2>

        <div *ngIf="projects.length === 0" class="no-projects">
            Δεν υπάρχουν projects. Δημιούργησε το πρώτο σου παραπάνω!
        </div>

        <div class="project-grid">
            <div
                *ngFor="let project of projects"
                class="project-card"
                (click)="selectProject(project.id)"
            >
                <h3>{{project.title}}</h3>
                <p>{{project.description}}</p>  
                <div class="card-footer">
                    <span class="view-link">Προβολή Tasks ➔</span>
                    <button class="btn-delete" (click)="deleteProject(project.id, $event)">Διαγραφή</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. ΠΡΟΒΟΛΗ TASK BOARD (όταν ΕΧΕΙ επιλεγεί project) -->
    <div *ngIf="selectedProjectId">
        <button class="btn-back" (click)="backToProjects()">← Πίσω στα Projects</button>
    
        <!-- Συνδέουμε το TaskBoardComponent περνώντας το selectedProjectId -->
        <app-task-board [projectId]="selectedProjectId"></app-task-board>
  </div>
</div>
